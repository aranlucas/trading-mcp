name: Prettier

on:
  push:
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25.x"
          cache: "pnpm"

      - name: Prettier
        run: pnpm dlx prettier@3.8.1 --check "packages/*/src/**/*.ts"
