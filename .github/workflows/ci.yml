name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Prove audit regressions against pre-fix sources
        shell: bash
        run: |
          # Native git restoration isolates this repository's pre-fix behavior; Vitest owns assertions.
          snapshot=$(mktemp -d)
          files=(packages/core/src/lib/timeout.ts packages/screener/src/services/market-data.ts packages/screener/src/app.ts)
          for file in "${files[@]}"; do
            mkdir -p "$snapshot/$(dirname "$file")"
            cp "$file" "$snapshot/$file"
          done
          restore() { for file in "${files[@]}"; do cp "$snapshot/$file" "$file"; done; }
          trap restore EXIT
          for file in "${files[@]}"; do
            git show b85cb574a151ffcf127df2dae2ed79296e4fa71c:"$file" > "$file"
          done
          pnpm run build
          mkdir -p audit-evidence
          if pnpm --filter @trading/core exec vitest run test/async-control.test.ts -t 'first available provider' > audit-evidence/core-before.log 2>&1; then
            cat audit-evidence/core-before.log
            exit 1
          fi
          cat audit-evidence/core-before.log
          if pnpm --filter @trading/screener exec vitest run test/market-data.test.ts test/screener.routes.test.ts -t 'out-of-range numeric dates|malformed JSON' > audit-evidence/rest-before.log 2>&1; then
            cat audit-evidence/rest-before.log
            exit 1
          fi
          cat audit-evidence/rest-before.log
          grep -E 'FAIL.*returns a usable result' audit-evidence/core-before.log
          grep -E 'FAIL.*out-of-range numeric dates' audit-evidence/rest-before.log
          grep -E 'FAIL.*malformed JSON' audit-evidence/rest-before.log

      - name: Build packages
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - parallel:
          - name: Typecheck
            run: pnpm -r typecheck && pnpm -r exec tsc -p tsconfig.tests.json && pnpm exec tsc -p tsconfig.tests.json && pnpm exec tsc -p api/tsconfig.json && pnpm exec tsc -p packages/screener/api/tsconfig.json

          - name: Lint
            run: pnpm run lint && pnpm run format:check && pnpm run secretlint && pnpm run syncpack:lint

          - name: Test
            run: pnpm -r test && pnpm exec vitest run

          - name: Build container
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            env:
              DOCKER_BUILD_RECORD_UPLOAD: "false"
            with:
              context: .
              push: false
              tags: trading-mcp:ci
              # PRs only restore; pushes and manual runs populate the layer cache.
              cache-from: type=gha,scope=trading-mcp
              cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=trading-mcp,mode=max,timeout=2m,ignore-error=true' || '' }}

      - name: End-to-end REST and stdio journeys
        run: pnpm exec e2e run

      - name: Upload audit and e2e evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-evidence
          path: |
            .e2e/
            audit-evidence/
          include-hidden-files: true
