name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Build packages
        run: pnpm run build

      - name: Test Docker context
        run: pnpm test:docker-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - parallel:
          - name: Typecheck
            run: pnpm -r typecheck && pnpm -r exec tsc -p tsconfig.tests.json && pnpm exec tsc -p tsconfig.tests.json && pnpm exec tsc -p api/tsconfig.json && pnpm exec tsc -p packages/screener/api/tsconfig.json

          - name: Lint
            run: pnpm run lint && pnpm run format:check && pnpm run secretlint && pnpm run syncpack:lint

          - name: Test
            run: pnpm -r test && pnpm exec vitest run

          - name: Build container
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            env:
              DOCKER_BUILD_RECORD_UPLOAD: "false"
            with:
              context: .
              load: true
              push: false
              tags: trading-mcp:ci
              # PRs only restore; pushes and manual runs populate the layer cache.
              cache-from: type=gha,scope=trading-mcp
              cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=trading-mcp,mode=max,timeout=2m,ignore-error=true' || '' }}
