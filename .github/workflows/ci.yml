name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Build packages
        run: pnpm run build

      - parallel:
          - name: Typecheck
            run: pnpm -r typecheck && pnpm -r exec tsc -p tsconfig.tests.json && pnpm exec tsc -p tsconfig.tests.json && pnpm exec tsc -p api/tsconfig.json && pnpm exec tsc -p packages/screener/api/tsconfig.json

          - name: Lint
            run: pnpm run lint && pnpm run format:check && pnpm run secretlint && pnpm run syncpack:lint

          - name: Test
            run: pnpm -r test && pnpm exec vitest run

          - name: Docker build
            run: |
              pnpm test:docker-context
              docker build -t trading-mcp:ci .
