version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
