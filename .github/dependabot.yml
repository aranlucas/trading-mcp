version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
